# Model type: 'pinn' or 'pikan'
model_type: 'pinn'

# Random seed
seed: 32

# Device configuration
device: 'cpu'  # 'cuda' or 'cpu'

# Data generation
data:
  N_interior: 10000
  N_boundary: 500
  N_data: 10000

# Network architecture
network:
  input_size: 2
  output_size: 1
  
  # For PINN (MLP)
  pinn:
    hidden_layers: 18
    hidden_units: 128
    activation: 'tanh'  # 'tanh', 'relu', 'sigmoid'
  
  # For PIKAN (KAN)
  pikan:
    width: [2, 6,6,6, 1]
    grid: 5
    k: 3

# Training parameters
training:
  adam_epochs: 25000
  lbfgs_iterations: 15000
  lr_adam: 6.545682261419958e-05
  lr_lbfgs: 0.013469398771979493
  lambda_bc: 1
  lambda_data: 579.8349518071875
  lambda_pde: 0.26039724051334473
  lambda_l1: 1.1693615072304626e-07
  lambda_l2: 2.150347578706856e-06
  plot_every: 1000
  plot_every_lbfgs: 100

# Output configuration
output:
  results_dir: 'results'  # 'results' for pinn, 'results_kan' for pikan
  conf_suffix: 'poisson_optuna_params'  # Configuration identifier for filenames

# Optuna hyperparameter optimization (used by optuna_pinn.py)
optuna:
  n_trials: 40
  timeout: null
  study_name: 'pinn_optuna'
  storage: null  # e.g. 'sqlite:///optuna_pinn.db'
  sampler_seed: 32
  n_startup_trials: 5
  n_warmup_steps: 0

  # Smaller data/epochs for faster HPO (override if needed)
  N_interior: 5000
  N_boundary: 200
  N_data: 2000
  adam_epochs: 5000
  lbfgs_iterations: 500
  eval_points: 60
  plot_every: 2000
  plot_every_lbfgs: 500

  # Search space
  hidden_layers_min: 2
  hidden_layers_max: 32
  hidden_units: [16, 32, 64, 128]
  activations: ['tanh', 'relu']
  lr_adam_min: 1.0e-5
  lr_adam_max: 1.0e-3
  lr_lbfgs_min: 1.0e-2
  lr_lbfgs_max: 1.0
  lambda_data_min: 1.0
  lambda_data_max: 1.0e3
  lambda_pde_min: 1.0e-1
  lambda_pde_max: 1.0e1
  lambda_l1_min: 1.0e-9
  lambda_l1_max: 1.0e-6
  lambda_l2_min: 1.0e-8
  lambda_l2_max: 1.0e-4
